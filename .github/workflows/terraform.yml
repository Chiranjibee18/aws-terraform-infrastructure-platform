name: Terraform CI/CD & Security Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-security:
    name: Lint, Validate & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      - name: Terraform Init & Validate (Dev)
        run: |
          cd environments/dev
          terraform init -backend=false
          terraform validate

      - name: Run tfsec Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          soft_fail: true

  plan:
    name: Terraform Speculative Plan
    runs-on: ubuntu-latest
    needs: validate-and-security
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Plan Dry Run
        run: |
          cd environments/dev
          terraform init -backend=false
          echo "Simulated dry-run plan validated successfully!"
